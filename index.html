<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七年级不规则动词背诵卡片</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@700&display=swap');

  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --surface2: #22223a;
    --accent: #7c6fff;
    --accent2: #ff6b9d;
    --accent3: #4ecdc4;
    --gold: #ffd166;
    --text: #e8e8f0;
    --text-muted: #888;
    --border: rgba(124,111,255,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,111,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .header {
    text-align: center;
    padding: 36px 20px 16px;
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .header p { color: var(--text-muted); font-size: 0.82rem; letter-spacing: 1px; }

  /* Plan tabs */
  .plan-tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 16px 20px;
  }
  .plan-tab {
    padding: 9px 22px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.25s;
  }
  .plan-tab:hover { border-color: var(--accent); color: var(--text); }
  .plan-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 18px rgba(124,111,255,0.4); }
  .plan-tab[data-plan="7"].active { background: var(--accent2); border-color: var(--accent2); box-shadow: 0 0 18px rgba(255,107,157,0.4); }
  .plan-tab[data-plan="5"].active { background: var(--accent3); border-color: var(--accent3); color: #0f0f14; box-shadow: 0 0 18px rgba(78,205,196,0.4); }

  /* Day nav */
  .day-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 20px 16px;
    flex-wrap: wrap;
  }
  .day-label { font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--text-muted); margin-right: 4px; }
  .day-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .day-btn:hover { border-color: var(--accent); color: var(--text); }
  .day-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 10px rgba(124,111,255,0.5); }
  .plan-7 .day-btn.active { background: var(--accent2); border-color: var(--accent2); }
  .plan-5 .day-btn.active { background: var(--accent3); border-color: var(--accent3); color: #0f0f14; }

  /* Progress */
  .progress-wrap {
    max-width: 580px;
    margin: 0 auto 20px;
    padding: 0 20px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-family: 'Space Mono', monospace;
  }
  .progress-bar { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Card wrapper */
  .card-area {
    max-width: 580px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* THE CARD — simple block, no 3D */
  .flashcard {
    width: 100%;
    min-height: 300px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: linear-gradient(135deg, var(--surface) 0%, rgba(124,111,255,0.08) 100%);
    cursor: pointer;
    user-select: none;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px 48px;
    gap: 14px;
  }
  .flashcard:hover { border-color: rgba(124,111,255,0.5); box-shadow: 0 8px 32px rgba(124,111,255,0.15); }
  .flashcard.is-back {
    background: linear-gradient(135deg, var(--surface) 0%, rgba(78,205,196,0.08) 100%);
  }
  .flashcard.is-back:hover { border-color: rgba(78,205,196,0.5); box-shadow: 0 8px 32px rgba(78,205,196,0.15); }

  /* flip animation */
  .flashcard.flip-out {
    animation: flipOut 0.18s ease-in forwards;
  }
  .flashcard.flip-in {
    animation: flipIn 0.18s ease-out forwards;
  }
  @keyframes flipOut {
    from { transform: scaleX(1); opacity: 1; }
    to   { transform: scaleX(0); opacity: 0.3; }
  }
  @keyframes flipIn {
    from { transform: scaleX(0); opacity: 0.3; }
    to   { transform: scaleX(1); opacity: 1; }
  }

  .card-num {
    position: absolute;
    top: 16px; left: 20px;
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
  }
  .card-tag {
    position: absolute;
    top: 14px; right: 16px;
    font-size: 0.62rem;
    padding: 2px 10px;
    border-radius: 100px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.5px;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .is-back .card-tag { border-color: var(--accent3); color: var(--accent3); }

  .card-hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.62rem;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* Front content */
  .front-zh {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 3px;
    text-align: center;
  }
  .front-base {
    font-size: 2.4rem;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 1px;
    text-align: center;
  }
  .front-divider {
    width: 40px; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 1px;
  }

  /* Back content */
  .back-zh {
    font-size: 1.1rem;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 4px;
    text-align: center;
  }
  .verb-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Space Mono', monospace;
  }
  .verb-table th {
    color: var(--text-muted);
    font-size: 0.6rem;
    padding: 5px 6px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  .verb-table td {
    padding: 9px 6px;
    text-align: center;
    font-size: 0.82rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .verb-table tr:last-child td { border-bottom: none; }
  .col-base { color: var(--accent3); font-weight: 700; }
  .col-s    { color: var(--text); }
  .col-ing  { color: var(--text-muted); }
  .col-past { color: var(--accent2); font-weight: 700; }
  .col-pp   { color: var(--gold); font-weight: 700; }

  /* Controls */
  .card-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 18px;
  }
  .ctrl-btn {
    padding: 10px 26px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.74rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .ctrl-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(124,111,255,0.1); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .ctrl-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(124,111,255,0.3); }
  .ctrl-btn.primary:hover { box-shadow: 0 4px 22px rgba(124,111,255,0.5); transform: translateY(-1px); }
  .card-counter { font-family: 'Space Mono', monospace; font-size: 0.78rem; color: var(--text-muted); min-width: 56px; text-align: center; }

  /* List */
  .list-toggle-btn {
    display: block;
    margin: 18px auto 0;
    padding: 8px 20px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .list-toggle-btn:hover { color: var(--text); border-color: var(--accent); }

  /* Speak button */
  .speak-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 14px;
    border-radius: 100px;
    border: 1.5px solid rgba(78,205,196,0.35);
    background: rgba(78,205,196,0.08);
    color: var(--accent3);
    font-size: 0.72rem;
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    user-select: none;
  }
  .speak-btn:hover { background: rgba(78,205,196,0.18); border-color: var(--accent3); }
  .speak-btn.speaking { background: rgba(78,205,196,0.25); border-color: var(--accent3); color: #fff; animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 0 rgba(78,205,196,0.4); } to { box-shadow: 0 0 10px rgba(78,205,196,0.6); } }

  .speak-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
    width: 100%;
  }
  .speak-row .speak-btn { font-size: 0.65rem; padding: 4px 10px; }

  .day-list {
    max-width: 580px;
    margin: 16px auto 0;
    padding: 0 20px 40px;
    display: none;
  }
  .day-list.visible { display: block; }

  .list-header {
    display: grid;
    grid-template-columns: 28px 70px 1fr 1fr 1fr 1fr;
    gap: 8px;
    padding: 6px 12px;
    font-size: 0.6rem;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    margin-bottom: 4px;
  }
  .list-grid { display: grid; gap: 5px; }
  .list-row {
    display: grid;
    grid-template-columns: 28px 70px 1fr 1fr 1fr 1fr;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid transparent;
    transition: border-color 0.15s;
    font-size: 0.73rem;
  }
  .list-row:hover { border-color: var(--border); }
  .r-num  { color: var(--text-muted); font-family: 'Space Mono', monospace; font-size: 0.62rem; }
  .r-zh   { color: var(--gold); }
  .r-base { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--text); }
  .r-ing  { font-family: 'Space Mono', monospace; color: var(--text-muted); font-size: 0.68rem; }
  .r-past { font-family: 'Space Mono', monospace; color: var(--accent2); font-size: 0.68rem; }
  .r-pp   { font-family: 'Space Mono', monospace; color: var(--gold); font-size: 0.68rem; }
</style>
</head>
<body>

<div class="header">
  <h1>不规则动词 · 背诵卡片</h1>
  <p>七年级上册 · 100个不规则动词 · 三种复习计划</p>
</div>

<div class="plan-tabs">
  <button class="plan-tab active" data-plan="10" onclick="setPlan(10)">📅 10天计划</button>
  <button class="plan-tab" data-plan="7" onclick="setPlan(7)">⚡ 7天计划</button>
  <button class="plan-tab" data-plan="5" onclick="setPlan(5)">🔥 5天计划</button>
</div>

<div class="day-nav" id="dayNav"></div>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="progressLabel">第 1 天 · 10天计划</span>
    <span id="progressCount">1 / 10</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:10%"></div>
  </div>
</div>

<div class="card-area">
  <!-- Single card div, JS toggles front/back content -->
  <div class="flashcard" id="flashcard" onclick="flipCard()">
    <div class="card-num" id="cardNum">#1</div>
    <div class="card-tag" id="cardTag">正面</div>

    <!-- Front -->
    <div id="frontContent" style="display:flex;flex-direction:column;align-items:center;gap:14px;">
      <div class="front-zh" id="frontZh">唤醒，醒来</div>
      <div class="front-divider"></div>
      <div class="front-base" id="frontBase">awake</div>
      <button class="speak-btn" id="speakFront" onclick="event.stopPropagation(); speakWord(document.getElementById('frontBase').textContent, 'speakFront')">🔊 朗读原形</button>
    </div>

    <!-- Back (hidden initially) -->
    <div id="backContent" style="display:none; width:100%;display:none;flex-direction:column;align-items:center;gap:10px;">
      <div class="back-zh" id="backZh">唤醒，醒来</div>
      <table class="verb-table">
        <thead>
          <tr>
            <th>原形</th><th>三单</th><th>现在分词</th><th>过去式</th><th>过去分词</th>
          </tr>
        </thead>
        <tbody id="verbTableBody"></tbody>
      </table>
      <div class="speak-row" id="speakRow"></div>
    </div>

    <div class="card-hint" id="cardHint">👆 点击翻转查看变化形式</div>
  </div>

  <div class="card-controls">
    <button class="ctrl-btn" id="prevBtn" onclick="prevCard()" disabled>← 上一个</button>
    <span class="card-counter" id="cardCounter">1 / 10</span>
    <button class="ctrl-btn primary" id="nextBtn" onclick="nextCard()">下一个 →</button>
  </div>

  <button class="list-toggle-btn" onclick="toggleList()">📋 查看今日单词列表</button>
</div>

<div class="day-list" id="dayList">
  <div class="list-header">
    <span>#</span><span>中文</span><span>原形</span><span>现在分词</span><span>过去式</span><span>过去分词</span>
  </div>
  <div class="list-grid" id="listGrid"></div>
</div>

<script>
const VERBS = [
  {n:1,  zh:"唤醒，醒来",  base:"awake",       s:"awakes",      ing:"awaking",      past:"awoke",         pp:"awoken/awake"},
  {n:2,  zh:"是",          base:"be",           s:"is",          ing:"being",         past:"was/were",      pp:"been"},

  {n:4,  zh:"打败，敲打",  base:"beat",         s:"beats",       ing:"beating",       past:"beat",          pp:"beaten"},
  {n:5,  zh:"变成",        base:"become",       s:"becomes",     ing:"becoming",      past:"became",        pp:"become"},
  {n:6,  zh:"开始",        base:"begin",        s:"begins",      ing:"beginning",     past:"began",         pp:"begun"},
  {n:7,  zh:"流血",        base:"bleed",        s:"bleeds",      ing:"bleeding",      past:"bled",          pp:"bled"},
  {n:8,  zh:"吹",          base:"blow",         s:"blows",       ing:"blowing",       past:"blew",          pp:"blown"},
  {n:9,  zh:"打破",        base:"break",        s:"breaks",      ing:"breaking",      past:"broke",         pp:"broken"},

  {n:47, zh:"知道，认识",  base:"know",         s:"knows",       ing:"knowing",       past:"knew",          pp:"known"},
  {n:48, zh:"放置，下蛋",  base:"lay",          s:"lays",        ing:"laying",        past:"laid",          pp:"laid"},
  {n:49, zh:"领导，引导",  base:"lead",         s:"leads",       ing:"leading",       past:"led",           pp:"led"},
  {n:50, zh:"学习",        base:"learn",        s:"learns",      ing:"learning",      past:"learnt/learned", pp:"learnt/learned"},
  {n:51, zh:"离开",        base:"leave",        s:"leaves",      ing:"leaving",       past:"left",          pp:"left"},
  {n:52, zh:"借出",        base:"lend",         s:"lends",       ing:"lending",       past:"lent",          pp:"lent"},

function splitDays(n) {
  const size = Math.ceil(100 / n);
  const out = [];
  for (let i = 0; i < n; i++) {
    const chunk = VERBS.slice(i * size, Math.min(i * size + size, 100));
    if (chunk.length) out.push(chunk);
  }
  return out;
}

const PLANS = { 10: splitDays(10), 7: splitDays(7), 5: splitDays(5) };

let plan = 10, day = 0, idx = 0, flipped = false, listOpen = false;

function verbs() { return PLANS[plan][day]; }

function setPlan(n) {
  plan = n; day = 0; idx = 0; flipped = false;
  document.querySelectorAll('.plan-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.plan-tab[data-plan="${n}"]`).classList.add('active');
  buildDayNav(); showCard(); renderList(); updateProgress();
}

function buildDayNav() {
  const nav = document.getElementById('dayNav');
  nav.className = `day-nav plan-${plan}`;
  const days = PLANS[plan].length;
  nav.innerHTML = `<span class="day-label">第几天：</span>` +
    Array.from({length: days}, (_, i) =>
      `<button class="day-btn${i===day?' active':''}" onclick="setDay(${i})">${i+1}</button>`
    ).join('');
}

function setDay(d) {
  day = d; idx = 0; flipped = false;
  document.querySelectorAll('.day-btn').forEach((b,i) => b.classList.toggle('active', i===d));
  showCard(); renderList(); updateProgress();
}

function showCard() {
  const v = verbs()[idx];
  const card = document.getElementById('flashcard');
  const front = document.getElementById('frontContent');
  const back  = document.getElementById('backContent');
  const hint  = document.getElementById('cardHint');
  const tag   = document.getElementById('cardTag');

  document.getElementById('cardNum').textContent = `#${v.n}`;

  if (!flipped) {
    card.classList.remove('is-back');
    front.style.display = 'flex';
    back.style.display  = 'none';
    tag.textContent  = '正面';
    hint.textContent = '👆 点击翻转查看变化形式';
    document.getElementById('frontZh').textContent   = v.zh;
    document.getElementById('frontBase').textContent = v.base;
    document.getElementById('speakFront').textContent = `🔊 朗读 ${v.base}`;
  } else {
    card.classList.add('is-back');
    front.style.display = 'none';
    back.style.display  = 'flex';
    tag.textContent  = '背面';
    hint.textContent = '👆 再次点击回到正面';
    document.getElementById('backZh').textContent = v.zh;
    document.getElementById('verbTableBody').innerHTML =
      `<tr>
        <td class="col-base">${v.base}</td>
        <td class="col-s">${v.s}</td>
        <td class="col-ing">${v.ing}</td>
        <td class="col-past">${v.past}</td>
        <td class="col-pp">${v.pp}</td>
      </tr>`;
    // Build per-form speak buttons
    const forms = [
      {label: `原形 ${v.base}`,    word: v.base},
      {label: `三单 ${v.s}`,      word: v.s},
      {label: `现分 ${v.ing}`,    word: v.ing},
      {label: `过去 ${v.past}`,   word: v.past.split('/')[0]},
      {label: `过分 ${v.pp}`,     word: v.pp.split('/')[0]},
    ];
    document.getElementById('speakRow').innerHTML = forms.map((f,i) =>
      `<button class="speak-btn" id="spk${i}" onclick="event.stopPropagation(); speakWord('${f.word.replace(/'/g,"\\'")}', 'spk${i}')">🔊 ${f.label}</button>`
    ).join('');
  }

  const list = verbs();
  document.getElementById('cardCounter').textContent = `${idx+1} / ${list.length}`;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === list.length - 1;
}

function flipCard() {
  flipped = !flipped;
  const card = document.getElementById('flashcard');
  card.classList.add('flip-out');
  setTimeout(() => {
    showCard();
    card.classList.remove('flip-out');
    card.classList.add('flip-in');
    setTimeout(() => card.classList.remove('flip-in'), 180);
  }, 180);
}

function nextCard() {
  if (idx < verbs().length - 1) { idx++; flipped = false; showCard(); updateProgress(); }
}
function prevCard() {
  if (idx > 0) { idx--; flipped = false; showCard(); updateProgress(); }
}

function updateProgress() {
  const total = verbs().length;
  const pct = Math.round(((idx + 1) / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${idx+1} / ${total}`;
  document.getElementById('progressLabel').textContent = `第 ${day+1} 天 · ${plan}天计划`;
}

function renderList() {
  document.getElementById('listGrid').innerHTML = verbs().map(v =>
    `<div class="list-row">
      <span class="r-num">${v.n}</span>
      <span class="r-zh">${v.zh}</span>
      <span class="r-base">${v.base}</span>
      <span class="r-ing">${v.ing}</span>
      <span class="r-past">${v.past}</span>
      <span class="r-pp">${v.pp}</span>
    </div>`
  ).join('');
}

function toggleList() {
  listOpen = !listOpen;
  document.getElementById('dayList').classList.toggle('visible', listOpen);
  document.querySelector('.list-toggle-btn').textContent = listOpen ? '🔼 收起列表' : '📋 查看今日单词列表';
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextCard();
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevCard();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
});

// ---- Text-to-Speech ----
let bestVoice = null;

function cleanWord(word) {
  return word.replace(/\/[^/]+\//g, '').split('/')[0].trim();
}

// Pick the best available English voice — prefer neural/premium ones
function pickVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;

  const preferred = [
    'Google US English',
    'Microsoft Aria Online (Natural)',
    'Microsoft Guy Online (Natural)',
    'Microsoft Jenny Online (Natural)',
    'Samantha',          // macOS/iOS — very natural
    'Karen',             // macOS Australian, clear
    'Daniel',            // macOS British, clear
    'Google UK English Female',
    'Google UK English Male',
  ];

  for (const name of preferred) {
    const v = voices.find(v => v.name === name);
    if (v) return v;
  }
  // Fallback: any en-US voice
  return voices.find(v => v.lang === 'en-US') ||
         voices.find(v => v.lang.startsWith('en')) ||
         null;
}

// Voices load async on first call — cache once ready
window.speechSynthesis.onvoiceschanged = () => { bestVoice = pickVoice(); };

function speakWord(word, btnId) {
  const clean = cleanWord(word);
  if (!clean) return;

  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn').forEach(b => b.classList.remove('speaking'));
  const btn = btnId ? document.getElementById(btnId) : document.getElementById('speakFront');
  if (btn) btn.classList.add('speaking');

  if (!bestVoice) bestVoice = pickVoice();

  const u = new SpeechSynthesisUtterance(clean);
  u.lang  = 'en-US';
  u.rate  = 0.82;
  u.pitch = 1.0;
  if (bestVoice) u.voice = bestVoice;

  const done = () => { if (btn) btn.classList.remove('speaking'); };
  u.onend  = done;
  u.onerror = done;
  window.speechSynthesis.speak(u);
}

// Init
buildDayNav();
showCard();
renderList();
updateProgress();
</script>
